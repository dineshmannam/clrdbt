apiVersion: apps/v1
kind: Deployment
metadata:
  name: clrdbt
  labels:
    app: clrdbt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clrdbt
  template:
    metadata:
      labels:
        app: clrdbt
    spec:
      containers:
        - name: clrdbt
          image: REGION-docker.pkg.dev/PROJECT_ID/clrdbt/clrdbt:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clrdbt-secrets
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: clrdbt-secrets
                  key: stripe-webhook-secret
            - name: GCS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: clrdbt-secrets
                  key: gcs-bucket-name
            - name: GCS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clrdbt-secrets
                  key: gcs-access-token
            - name: APP_BASE_URL
              value: "https://clrdbt.com"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
